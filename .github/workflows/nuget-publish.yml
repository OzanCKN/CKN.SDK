name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*' # Trigger only on version tags like v1.0.0, v2.1.3-preview
  workflow_dispatch: # Allow manual trigger for debugging

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CKN.SDK.slnx

    - name: Build solution
      run: dotnet build CKN.SDK.slnx --configuration Release --no-restore

    - name: Test solution
      run: dotnet test CKN.SDK.slnx --configuration Release --no-build --verbosity normal

    - name: Pack all projects
      run: dotnet pack CKN.SDK.slnx --configuration Release --no-build --output ./artifacts/packages

    - name: Publish to NuGet
      run: |
        for file in ./artifacts/packages/*.nupkg; do
          echo "Publishing $file..."
          dotnet nuget push "$file" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
